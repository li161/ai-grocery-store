name: Sync Platform Actions

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retail-intelligence-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect platform action candidates
        run: npm run sync:platform
      - name: Commit annual platform archive
        run: |
          git config user.name "ai-grocery-store-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/platform-actions-2026.json; then
            echo "No platform action changes."
            exit 0
          fi
          git add public/platform-actions-2026.json
          git commit -m "chore: sync annual platform actions"
          git push
