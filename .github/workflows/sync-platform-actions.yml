name: Sync Platform Actions

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-platform-actions.mjs'
      - '.github/workflows/sync-platform-actions.yml'
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retail-intelligence-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate collection script syntax
        run: node --check scripts/sync-platform-actions.mjs
      - name: Collect platform action candidates
        run: npm run sync:platform
      - name: Commit annual platform archive
        run: |
          git config user.name "ai-grocery-store-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ARCHIVE_FILE="public/platform-actions-$(date -u +%Y).json"
          if git diff --quiet -- "$ARCHIVE_FILE"; then
            echo "No platform action changes."
            exit 0
          fi
          git add "$ARCHIVE_FILE"
          git commit -m "chore: sync annual platform actions"
          git push
