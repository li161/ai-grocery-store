name: Sync Retail Intelligence

on:
  push:
    paths:
      - 'scripts/sync-retail-news.mjs'
      - 'scripts/persist-retail-intelligence.mjs'
      - '.github/workflows/sync-retail-news.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retail-intelligence-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync public retail feeds
        env:
          OPENAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL || secrets.OPENAI_BASE_URL }}
          RETAIL_LLM_MODEL: ${{ secrets.RETAIL_LLM_MODEL || 'deepseek-v4-flash' }}
        run: |
            npm run sync:retail
            node scripts/persist-retail-intelligence.mjs
            node scripts/enrich-retail-data.mjs

      - name: Commit changed intelligence
        run: |
          git config user.name "ai-grocery-store-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/data/retailNews.generated.js public/retail-news.json public/retail-events.json public/retail-daily.json public/retail-source-health.json public/retail-changes.json; then
            echo "No retail intelligence changes."
            exit 0
          fi
          git add src/data/retailNews.generated.js public/retail-news.json public/retail-events.json public/retail-daily.json public/retail-source-health.json public/retail-changes.json public/retail-history
          git commit -m "chore: sync retail intelligence"
          git push
