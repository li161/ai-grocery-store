name: Code quality

on:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check formatting of changed files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_BASE_REF}"
          mapfile -t files < <(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" | grep -E '\.(js|mjs|vue|css|json)$' || true)
          if (("${#files[@]}" > 0)); then
            npx prettier --check "${files[@]}"
          else
            echo "No supported source files changed; skipping formatting check."
          fi

      - name: Run lint
        run: npm run lint

      - name: Test Unity scene contract
        run: npm run test:unity-contract

      - name: Build production bundle
        run: npm run build
