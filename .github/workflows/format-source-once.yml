name: Format source files

on:
  push:
    branches:
      - chore/eslint-prettier-baseline

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prettier --write "src/**/*.{js,mjs,vue,css}" "scripts/**/*.{js,mjs}" "services/**/*.{js,mjs,json}" "package.json" "eslint.config.js" ".prettierrc.json"
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "Formatting is already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts services package.json eslint.config.js .prettierrc.json
          git commit -m "style: format source files with Prettier"
          git push
